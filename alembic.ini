# Alembic configuration. The database URL comes from app settings (DATABASE_URL),
# not from this file; see alembic/env.py.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# Revisions are filed by the day they were written: versions/YYYY/MM/DD/.
#
# Every day that holds revisions is listed here. That listing is what puts a
# new revision in a dated directory at all: given a single location Alembic
# writes to its root and ignores the nesting, and given several it reuses the
# current head's directory.
#
# The catch is that a new revision follows the head rather than the calendar,
# so the first revision of a new day takes three steps:
#
#   mkdir -p alembic/versions/2026/09/14
#   # append that path to version_locations below
#   uv run alembic revision --version-path alembic/versions/2026/09/14 -m "..."
#
# Skip them and the revision lands in the previous day's directory. It still
# applies in the right order -- the chain is held by down_revision, not by the
# path -- so a missed step misfiles history rather than breaking it.
#
# Paths are separated by the OS path separator, set above. Keep them on one
# line: a multi-line value parses as a single path and Alembic then finds no
# revisions at all.
version_locations = %(here)s/alembic/versions/2026/08/21
recursive_version_locations = true

# The directory carries the full date, so the filename is just the revision
# and its slug.
file_template = %%(rev)s_%%(slug)s
