name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: Comma-separated platforms to build, e.g. linux/amd64,linux/arm64
        required: false
        type: string

# Override repo-wide with the BUILD_PLATFORMS repository variable, or per run
# with the workflow_dispatch input above.
env:
  BUILD_PLATFORMS: ${{ inputs.platforms || vars.BUILD_PLATFORMS || 'linux/amd64,linux/arm64' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: MyPy
        run: uv run mypy app/

      - name: Tests
        run: uv run pytest

  boot:
    name: Service boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Boot the service and hit /health
        run: bin/verify --local

  docker:
    name: Image builds and runs
    runs-on: ubuntu-latest
    # Skipped automatically once the Docker layer is ejected.
    steps:
      - uses: actions/checkout@v7

      - name: Check for the Docker layer
        id: docker_layer
        run: |
          if [[ -f Dockerfile && -f docker-compose.yml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Docker layer ejected, skipping."
          fi

      - name: Set up QEMU
        if: steps.docker_layer.outputs.present == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.docker_layer.outputs.present == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and verify the container is healthy
        if: steps.docker_layer.outputs.present == 'true'
        run: bin/verify --docker

      - name: Build for target platforms
        if: steps.docker_layer.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.BUILD_PLATFORMS }}
          push: false
